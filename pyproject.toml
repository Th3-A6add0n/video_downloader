[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-downloader"
version = "1.0.0"
description = "Cross-platform video downloader powered by yt-dlp and ffmpeg."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Th3 A6add0n", email = "th3.a6add0n@gmail.com" }]
dependencies = [
    "PySide6>=6.7",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
video-downloader = "video_downloader.app:main"

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
# Briefcase configuration
# --------------------------------------------------------------------------- #

[tool.briefcase]
project_name = "Video Downloader"
bundle = "org.videodownloader"
version = "1.0.0"
url = "https://github.com/Th3-A6add0n/video_downloader"
author = "Th3 A6add0n"
author_email = "th3.a6add0n@gmail.com"

[tool.setuptools.package-data]
"video_downloader.resources" = ["*.png", "*.ico", "*.icns"]

[tool.briefcase.app.video_downloader]
formal_name = "Video Downloader"
icon = "src/video_downloader/resources/icon"
description = "Download videos from YouTube and other platforms."
long_description = """
Download videos from YouTube and other platforms, auto-converted to
NLE-friendly H.264/AAC using ffmpeg.
"""
sources = ["src/video_downloader"]
requires = [
    "PySide6>=6.7",
    "platformdirs>=4.2",
]

[tool.briefcase.app.video_downloader.macOS]
universal_build = true
requires = []

[tool.briefcase.app.video_downloader.windows]
requires = []

[tool.briefcase.app.video_downloader.linux.flatpak]
# Use the KDE runtime, which comes with PySide6/Qt6 support.
flatpak_runtime = "org.kde.Platform"
flatpak_runtime_version = "6.9"
flatpak_sdk = "org.kde.Sdk"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]