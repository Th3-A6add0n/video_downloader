name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish release immediately (skip draft)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux
            platform: linux
            format: flatpak
            runs-on: ubuntu-24.04
            artifact-glob: "*.flatpak"
          - target: macOS
            platform: macOS
            format: app
            runs-on: macos-latest
            artifact-glob: "*.dmg"
          - target: Windows
            platform: windows
            format: app
            runs-on: windows-latest
            artifact-glob: "*.msi"

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Flatpak tooling (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          sudo flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.kde.Platform//6.9 org.kde.Sdk//6.9

      - name: Install Briefcase
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "briefcase==0.4.4"

      - name: Install project (for lint/tests)
        shell: bash
        run: python -m pip install -e ".[dev]"

      - name: Lint
        shell: bash
        run: ruff check src

      - name: Briefcase create
        shell: bash
        run: briefcase create ${{ matrix.platform }} ${{ matrix.format }} --no-input --log

      - name: Briefcase build
        shell: bash
        run: briefcase build ${{ matrix.platform }} ${{ matrix.format }} --no-input --log

      - name: Briefcase package (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: briefcase package linux flatpak --no-input --log

      - name: Briefcase package (macOS)
        if: matrix.platform == 'macOS'
        shell: bash
        run: briefcase package macOS app -p dmg --adhoc-sign --no-input --log

      - name: Briefcase package (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: briefcase package windows app -p msi --adhoc-sign --no-input --log

      - name: List dist contents (debug)
        shell: bash
        run: |
          echo "Contents of dist/:"
          ls -la dist/ || echo "dist/ does not exist"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: dist/${{ matrix.artifact-glob }}
          if-no-files-found: error

      - name: Upload Briefcase logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.target }}
          path: logs/
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        shell: bash
        run: |
          echo "Downloaded artifact tree:"
          find artifacts -type f -exec ls -la {} \;

      - name: Flatten artifact tree
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name "*.msi" -o -name "*.dmg" -o -name "*.pkg" \
               -o -name "*.flatpak" -o -name "*.deb" -o -name "*.rpm" \
               -o -name "*.zip" \) \
            -exec cp -v {} release/ \;
          echo "Release files:"
          ls -la release

      - name: Verify at least one installer exists
        shell: bash
        run: |
          count=$(find release -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No installer files found in release/"
            exit 1
          fi
          echo "Found $count installer file(s)."

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}