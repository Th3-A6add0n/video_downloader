name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "Linux"
            platform: "Linux"
            output-format: "AppImage"
            runs-on: "ubuntu-24.04"
            artifact-glob: "*.AppImage"
          - target: "macOS"
            platform: "macOS"
            output-format: "DMG"
            runs-on: "macos-latest"
            artifact-glob: "*.dmg"
          - target: "Windows"
            platform: "Windows"
            output-format: "MSI"
            runs-on: "windows-latest"
            artifact-glob: "*.msi"

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linux system dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            socat \
            patchelf \
            libgl1 \
            libegl1 \
            libglib2.0-0t64 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxcb-cursor0

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install briefcase

      - name: Install project (for lint/tests)
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src

      - name: Briefcase create
        run: briefcase create ${{ matrix.platform }} ${{ matrix.output-format }} --no-input --log

      - name: Briefcase build
        run: briefcase build ${{ matrix.platform }} ${{ matrix.output-format }} --no-input --log

      - name: Briefcase package
        run: |
          briefcase package ${{ matrix.platform }} ${{ matrix.output-format }} \
            --update --adhoc-sign --no-input --log

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: dist/${{ matrix.artifact-glob }}
          if-no-files-found: error

      - name: Upload Briefcase logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.target }}
          path: logs/
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name "*.msi" -o -name "*.dmg" -o -name "*.pkg" \
               -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.zip" \) \
            -exec cp {} release/ \;
          ls -la release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}